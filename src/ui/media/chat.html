<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}};" />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>KeyRotator Chat</title>
</head>
<body>
  <section class="chat">
    <header class="chat-header">
      <div class="title">
        <span class="dot"></span>
        <span id="chatTitle">Nueva conversación</span>
      </div>
      <!-- Account menu (switch API / Add Account / Open Dashboard) -->
      <div class="acct-wrap">
        <button id="acctBtn" class="acct-btn"><span id="activeAccount">—</span> ▾</button>
        <div id="acctMenu" class="menu hidden">
          <div class="menu-label">Cuenta del chat</div>
          <div id="acctList"></div>
          <div class="menu-sep"></div>
          <button class="menu-item" data-act="addAccount">＋ Add Account</button>
          <button class="menu-item" data-act="openDashboard">▦ Open Dashboard</button>
        </div>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="welcome">
        <h3>Chat</h3>
        <p>Elige un chat en la barra lateral (KeyRotator) o escribe abajo para empezar uno nuevo. Escribe <b>/</b> para tus comandos y skills.</p>
      </div>
    </main>

    <!-- Composer with slash autocomplete -->
    <div class="composer-wrap">
      <div id="slashMenu" class="slash-menu hidden"></div>
      <footer class="composer">
        <button id="plusBtn" class="plus-btn" title="Adjuntar / funciones">＋</button>
        <div id="plusMenu" class="menu up hidden">
          <button class="menu-item" data-act="attachFile">⤓ Adjuntar archivo</button>
        </div>
        <textarea id="input" placeholder="Escribe un mensaje…  ( / para comandos · Enter envía )" rows="1"></textarea>
        <button id="sendBtn" title="Enviar">Enviar</button>
      </footer>
      <!-- Bottom controls (like native: model + effort + active model) -->
      <div class="bottom-bar">
        <label class="ctl">
          <span>Modelo</span>
          <select id="modelSelect">
            <option value="">Default</option>
            <option value="claude-sonnet-4-6">Sonnet 4.6</option>
            <option value="claude-fable-5">Fable 5</option>
            <option value="claude-opus-4-8">Opus 4.8</option>
            <option value="claude-haiku-4-5">Haiku 4.5</option>
          </select>
        </label>
        <label class="ctl">
          <span>Esfuerzo</span>
          <select id="effortSelect">
            <option value="">Default</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
        </label>
        <span class="spacer"></span>
        <span id="activeModel" class="model-badge" title="Modelo en uso (reportado por Claude)">—</span>
      </div>
    </div>
  </section>

  <script src="{{scriptUri}}"></script>
</body>
</html>
