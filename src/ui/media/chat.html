<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}};" />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>KeyRotator Chat</title>
</head>
<body>
  <section class="chat">
    <header class="chat-header">
      <div class="title">
        <span class="dot"></span>
        <span id="chatTitle">Nueva conversación</span>
      </div>
      <!-- Account menu (switch model + Dashboard) -->
      <div class="acct-wrap">
        <button id="acctBtn" class="acct-btn"><span id="activeAccount">—</span> ▾</button>
        <div id="acctMenu" class="menu hidden">
          <div class="menu-label">Modo de trabajo</div>
          <button class="menu-item mode-item active" data-mode="individual">
            <b>● Modo individual</b><small>Un solo modelo — el que elijas abajo a la izquierda.</small>
          </button>
          <button class="menu-item mode-item" data-mode="agency">
            <b>○ Modo agencia</b><small>Un director investiga qué modelo sirve para cada parte, los pone a trabajar en paralelo e integra el resultado.</small>
          </button>
          <div class="menu-sep"></div>
          <div class="menu-label">Director de la agencia</div>
          <div id="directorList"></div>
          <div class="menu-sep"></div>
          <button class="menu-item" data-act="pasteSnippet">＋ Agregar modelo (pegar código)</button>
          <button class="menu-item" data-act="openDashboard">▦ Administrar modelos</button>
        </div>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="welcome">
        <h3>Chat</h3>
        <p>Elige un chat en la barra lateral (KeyRotator) o escribe abajo para empezar uno nuevo. Escribe <b>/</b> para tus comandos y skills.</p>
      </div>
    </main>

    <!-- Composer with slash autocomplete -->
    <div class="composer-wrap">
      <div id="slashMenu" class="slash-menu hidden"></div>
      <div id="queueBar" class="queue-bar hidden"></div>
      <div id="attachBar" class="attach-bar hidden"></div>
      <footer class="composer">
        <button id="plusBtn" class="plus-btn" title="Adjuntar / funciones">＋</button>
        <div id="plusMenu" class="menu up hidden">
          <button class="menu-item" data-act="attachFile">⤓ Adjuntar archivo</button>
          <button class="menu-item" data-act="attachImage">🖼 Adjuntar imagen</button>
        </div>
        <textarea id="input" placeholder="Escribe un mensaje…  ( / para comandos · Enter envía )" rows="1"></textarea>
        <button id="sendBtn" title="Enviar">Enviar</button>
      </footer>
      <!-- Bottom controls (like native: model + effort + active model) -->
      <div class="bottom-bar">
        <!-- Claude controls (model + effort) -->
        <span id="claudeControls" class="ctl-group">
          <label class="ctl">
            <span>Modelo</span>
            <select id="modelSelect"><option value="">detectando…</option></select>
          </label>
          <label class="ctl">
            <span>Esfuerzo</span>
            <select id="effortSelect">
              <option value="">Default</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="xhigh">xhigh</option>
              <option value="max">max</option>
            </select>
          </label>
        </span>
        <!-- Web-chat controls (DeepSeek model + feature toggles) -->
        <span id="webControls" class="ctl-group hidden">
          <label class="ctl">
            <span>Modelo</span>
            <select id="webModelSelect"></select>
          </label>
          <span id="webToggles" class="toggles"></span>
        </span>
        <span class="spacer"></span>
        <span id="usageBadge" class="model-badge hidden" title="Cuándo se reinicia tu límite de uso"></span>
        <span id="activeModel" class="model-badge" title="Modelo en uso (reportado por Claude)">—</span>
      </div>
    </div>
  </section>

  <script src="{{scriptUri}}"></script>
</body>
</html>
